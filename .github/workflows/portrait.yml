# Redraws the ASCII portrait from the framed avatar(s) in .github/portrait/*.png.
# Run it by hand. It uploads the SVGs as an artifact to look over; copy the chosen one to
# assets/portrait.svg and commit it yourself. This workflow never pushes.
#
# Safety, job by job:
# - prepare: read-only token; only copies the inputs.
# - draw:    the only job that runs third-party code (readme-portrait 0.1.0 from npm, pinned by
#            sha512 in .github/portrait/package-lock.json, install scripts disabled). It has no
#            token and reads only the framed image, so it makes no network calls after install.
# All actions are GitHub's own and pinned to full commit SHAs.
name: Portrait

on:
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect inputs
        run: |
          mkdir -p "$RUNNER_TEMP/input"
          cp .github/portrait/package.json .github/portrait/package-lock.json .github/portrait/*.png "$RUNNER_TEMP/input/"
          ls -l "$RUNNER_TEMP/input"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portrait-input
          path: ${{ runner.temp }}/input/
          if-no-files-found: error
          retention-days: 1

  draw:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portrait-input
          path: ${{ runner.temp }}/portrait

      - name: Install readme-portrait (exact tarballs, hash-checked, no install scripts)
        run: |
          cd "$RUNNER_TEMP/portrait"
          node --version
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Draw
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          cd "$RUNNER_TEMP/portrait"
          mkdir out
          for src in *.png; do
            name="${src%.png}"
            node node_modules/readme-portrait/bin/readme-portrait.mjs "./$src" --name "$OWNER" \
              --style reveal --contrast local --brightness 1.3 --cols 130 --crop-top 0 -o "out/$name.svg"
            node node_modules/readme-portrait/bin/readme-portrait.mjs "./$src" --name "$OWNER" \
              --style reveal --contrast local --brightness 1.3 --cols 130 --crop-top 0 --no-animate -o "out/$name-static.svg"
          done
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portrait
          path: ${{ runner.temp }}/portrait/out/
          if-no-files-found: error
          retention-days: 7
