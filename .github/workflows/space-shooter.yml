# Draws the contribution-graph space shooter (gh-space-shooter) and publishes it to the
# `output` branch, which README.md points at.
#
# Safety, job by job:
# - fetch:   read-only token; runs only GitHub's own `gh` CLI to save the contribution calendar.
# - draw:    the only job that runs third-party code (gh-space-shooter from PyPI, exact versions
#            checked by hash in .github/space-shooter/requirements.txt). It has no token at all
#            and draws the game from the saved calendar file.
# - publish: write token; runs no third-party code. It treats the drawn GIF as untrusted data:
#            checks it is a single GIF file, copies it into a fresh repo and pushes only that.
# All actions are GitHub's own and pinned to full commit SHAs.
name: Space shooter

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: space-shooter
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Save the contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$RUNNER_TEMP/input"
          cp .github/space-shooter/requirements.txt "$RUNNER_TEMP/input/"
          gh api graphql -f login="$OWNER" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount contributionLevel } }
                  }
                }
              }
            }' --jq '
            .data.user.contributionsCollection.contributionCalendar
            | {
                username: env.OWNER,
                total_contributions: .totalContributions,
                weeks: [.weeks[-52:][] | {days: [.contributionDays[] | {
                  date,
                  count: .contributionCount,
                  level: ({"NONE": 0, "FIRST_QUARTILE": 1, "SECOND_QUARTILE": 2, "THIRD_QUARTILE": 3, "FOURTH_QUARTILE": 4}[.contributionLevel] // 0)
                }]}]
              }' > "$RUNNER_TEMP/input/calendar.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: input
          path: ${{ runner.temp }}/input/
          if-no-files-found: error
          retention-days: 1

  draw:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: input
          path: ${{ runner.temp }}/game

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install gh-space-shooter (exact versions, hash-checked)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-input -r "$RUNNER_TEMP/game/requirements.txt"

      - name: Draw the game (no token, saved calendar only)
        env:
          OWNER: ${{ github.repository_owner }}
          PYTHONIOENCODING: utf-8
        run: |
          cd "$RUNNER_TEMP/game"
          gh-space-shooter "$OWNER" --raw-input calendar.json --output space-shooter.gif --strategy random --fps 40
          ls -l space-shooter.gif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: space-shooter
          path: ${{ runner.temp }}/game/space-shooter.gif
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: draw
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: space-shooter
          path: ${{ runner.temp }}/artifact

      - name: Push to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
          ART: ${{ runner.temp }}/artifact/space-shooter.gif
        run: |
          # The artifact came from the job that ran third-party code: trust only this one file,
          # and never run git inside the folder it was unpacked into.
          if [ -L "$ART" ] || [ ! -f "$ART" ]; then echo "::error::space-shooter.gif is missing or not a regular file"; exit 1; fi
          case "$(head -c 6 "$ART")" in GIF87a|GIF89a) ;; *) echo "::error::artifact is not a GIF"; exit 1 ;; esac
          if [ "$(stat -c %s "$ART")" -gt 26214400 ]; then echo "::error::GIF is larger than 25 MB"; exit 1; fi

          repo="$RUNNER_TEMP/publish"
          mkdir "$repo"
          cp -- "$ART" "$repo/space-shooter.gif"
          cd "$repo"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init -q -b output
          git add space-shooter.gif
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update space shooter"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/output
